name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master
    paths-ignore:
      - 'frontend/**' # Don't trigger backend deployment if only frontend code was changed

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Check if the repo exists. If not, clone it.
            if [ ! -d "careerON" ]; then
              git clone https://github.com/Skullybutcher/careerON.git
            fi
            
            # 2. Go into the directory
            cd careerON
            
            # 3. Pull the latest code
            git pull origin main || git pull origin master
            
            # 4. Rebuild and restart the Docker containers in the background
            sudo docker-compose up -d --build
