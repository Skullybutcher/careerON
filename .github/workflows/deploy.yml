name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - master # Triggers on push to either main or master
    paths-ignore:
      - 'frontend/**' # Don't trigger backend deployment if only frontend code was changed

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: SSH into EC2 and Deploy
        uses: appleboy/ssh-action@master
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          envs: GEMINI_API_KEY,NVIDIA_API_KEY
          script: |
            # 1. Check if the repo exists. If not, clone it.
            if [ ! -d "careerON" ]; then
              git clone https://github.com/Skullybutcher/careerON.git
            fi
            
            # 2. Go into the directory
            cd careerON
            
            # Create the .env file securely from GitHub Secrets
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo "NVIDIA_API_KEY=$NVIDIA_API_KEY" >> .env
            
            # 3. Pull the latest code
            git pull origin main || git pull origin master
            
            # 4. Clear out old dangling Docker caches/layers to prevent disk space errors
            sudo docker system prune -af
            
            # 5. Rebuild and restart the Docker containers in the background
            sudo docker-compose up -d --build
